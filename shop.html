<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Starbucks Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <section class="shop" id="shop">
        <div class="heading">
            <span>Shop Now</span>
            <h1>Shop Coffee</h1>
        </div>
        <div class="shop-container">
            <div class="box">
                <div class="box-img">
                    <img src="assest/img2.png" alt="Rose Frappuccino">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star-half'></i>
                </div>
                <h2>Rose Frappuccino</h2>
                <span>$12.5</span>
                <a href="coffee.html" class="btn">Buy Now</a>
            </div>
            <div class="box">
                <div class="box-img">
                    <img src="assest/img1.png" alt="Green Mocha Frappuccino">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                </div>
                <h2>Green Mocha Frappuccino</h2>
                <span>$15.00</span>
                <a href="coffee3.html" class="btn">Order Now</a>
            </div>
            <div class="box">
                <div class="box-img">
                    <img src="assest/drink4.png" alt="Chocolate Frappuccino">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star-half'></i>
                </div>
                <h2>Chocolate Frappuccino</h2>
                <span>$14.5</span>
                <a href="coffee2.html" class="btn">Order Now</a>
            </div>
            <div class="box">
                <div class="box-img">
                    <img src="assest/img7.png" alt="Caramel Macchiato">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star-half'></i>
                </div>
                <h2>Caramel Macchiato</h2>
                <span>$14.5</span>
                <a href="#" class="btn">Order Now</a>
            </div>
            <div class="box">
                <div class="box-img">
                    <img src="assest/img8.png" alt="Vanilla Latte">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star-half'></i>
                </div>
                <h2>Vanilla Latte</h2>
                <span>$14.5</span>
                <a href="#" class="btn">Order Now</a>
            </div>
            <div class="box">
                <div class="box-img">
                    <img src="assest/img5.png" alt="Cold Brew Coffee">
                </div>
                <div class="star">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star-half'></i>
                </div>
                <h2>Cold Brew Coffee</h2>
                <span>$14.5</span>
                <a href="#" class="btn">Order Now</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
