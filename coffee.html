<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Frappuccino — Starbucks Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <style>
    .product-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      padding: 2rem 1rem;
    }
  </style>
</head>

<body>

  <div class="product-wrapper" id="cardContainer">
    <div class="card" style="width: 18rem; border: 5px solid seagreen;">
      <img src="assest/drink1.png" class="card-img-top" alt="Rose Frappuccino" style="width: 200px; margin: auto;">
      <div class="card-body" style="background-color: rgb(161, 236, 161); border-radius: 10px;">
        <div class="star">
          <i class='bx bxs-star'></i>
          <i class='bx bxs-star'></i>
          <i class='bx bxs-star'></i>
          <i class='bx bxs-star'></i>
          <i class='bx bxs-star-half'></i>
        </div>
        <h5 class="card-title">Rose Frappuccino</h5>
        <span>$12.5</span>
        <p class="card-text">A floral blend with rose syrup and beautiful pink whipped cream — refreshing and elegant.</p>
        <a href="#" id="linkBtn" class="btn">Order Now</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const btn = document.getElementById("linkBtn");
      btn.addEventListener("click", function (event) {
        event.preventDefault();
        if (!document.getElementById("customAlert")) {
          const alertDiv = document.createElement("div");
          alertDiv.className = "alert alert-success mt-3 text-center";
          alertDiv.id = "customAlert";
          alertDiv.role = "alert";
          alertDiv.innerText = "Your order is confirmed! Thank you for your order.";
          const container = document.getElementById("cardContainer");
          container.appendChild(alertDiv);
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
